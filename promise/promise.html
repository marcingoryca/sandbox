<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise #1</title>
</head>
<body>
    <script>
        let promise = new Promise(function(resolve, reject) {

            setTimeout(() => resolve("Promise done!"), 1000);
        });

        function done(result) {
            alert(result);
            alert("done");
        }

        promise.then(done);
    </script>
</body>
</html>
