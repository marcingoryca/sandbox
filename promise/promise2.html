<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise #2</title>
</head>
<body>
    <script>
        new Promise(function(resolve, reject) {
            setTimeout(() => resolve(1), 1000);
        }).then(function(result) {
            alert(result);
            result * 2;
        }).then(function(result) {
            alert(result);
            result * 2;
        }).then(function(result) {
            alert(result);
            result * 2;
        });
    </script>
</body>
</html>
